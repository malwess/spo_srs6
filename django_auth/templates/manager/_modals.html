<!-- Форма курса: используется и для добавления (POST), и для изменения (PATCH) -->
<div class="modal modal-blur fade" id="course-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <form class="modal-content" id="course-form" novalidate>
            <div class="modal-header">
                <h5 class="modal-title">Курс</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
            </div>
            <div class="modal-body">
                <div class="form-errors"></div>
                <div class="mb-3">
                    <label class="form-label required" for="course-title">Название курса</label>
                    <input class="form-control" id="course-title" name="title" maxlength="250">
                    <div class="invalid-feedback" data-error="title"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label required" for="course-department">Факультет</label>
                    <select class="form-select js-departments" id="course-department" name="department">
                        <option value="">Выберите факультет</option>
                    </select>
                    <div class="invalid-feedback" data-error="department"></div>
                </div>
                <div>
                    <label class="form-label" for="course-description">Описание</label>
                    <textarea class="form-control" id="course-description" name="description" rows="3"></textarea>
                    <div class="invalid-feedback" data-error="description"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-link link-secondary me-auto" data-bs-dismiss="modal">Отмена</button>
                <button type="submit" class="btn btn-primary"><i class="ti ti-device-floppy me-1"></i>Сохранить</button>
            </div>
        </form>
    </div>
</div>

<!-- Форма факультета: POST и PUT -->
<div class="modal modal-blur fade" id="department-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-sm modal-dialog-centered">
        <form class="modal-content" id="department-form" novalidate>
            <div class="modal-header">
                <h5 class="modal-title">Факультет</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
            </div>
            <div class="modal-body">
                <div class="form-errors"></div>
                <label class="form-label required" for="department-name">Название факультета</label>
                <input class="form-control" id="department-name" name="name">
                <div class="invalid-feedback" data-error="name"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-link link-secondary me-auto" data-bs-dismiss="modal">Отмена</button>
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </div>
        </form>
    </div>
</div>

<!-- Подтверждение опасной операции -->
<div class="modal modal-blur fade" id="confirm-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-sm modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-status bg-danger"></div>
            <div class="modal-body text-center py-4">
                <i class="ti ti-alert-triangle text-danger mb-2" style="font-size: 3rem"></i>
                <h3>Подтвердите удаление</h3>
                <div class="text-secondary" id="confirm-text"></div>
            </div>
            <div class="modal-footer">
                <div class="w-100 row g-2">
                    <div class="col"><button class="btn w-100" data-bs-dismiss="modal">Отмена</button></div>
                    <div class="col"><button class="btn btn-danger w-100" id="confirm-ok">Удалить</button></div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts"></div>
